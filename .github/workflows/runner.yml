name: Local runner packages
# Cost (see CLAUDE.md): four operating systems per run, 2 to 7 minutes each. Free while the repository is public;
# if it goes private, GitHub bills Windows minutes at 2x and macOS at 10x (about 100 billed minutes a run), so keep
# this to merges that change what the runner ships, and cancel a run that a newer merge supersedes.
# Merges to main publish a release (pull requests are tested before they merge; CI no longer runs on main).
on:
  pull_request:
    paths: ['launcher/**', 'utilsim/worker/**', 'scripts/build_runner.py', '.github/workflows/runner.yml']
  push:
    branches: [main]
    paths: ['launcher/**', 'utilsim/**', 'api/**', 'packages/town-viewer/dist/**', 'scripts/build_runner.py',
            'pyproject.toml', 'uv.lock', '.github/workflows/runner.yml']
  workflow_dispatch:
concurrency:
  group: runner-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  package:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv python install 3.11
      - run: uv sync --all-extras
      - run: uv pip install pyinstaller cryptography
      - run: npm ci --prefix packages/town-viewer
      - run: go test ./...
        working-directory: launcher
      - name: Build and smoke test runtime
        shell: bash
        run: |
          TAG="runner-$(git rev-parse --short=12 HEAD)"
          uv run python scripts/build_runner.py --tag "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: runner-${{ matrix.os }}
          path: dist/release/*
          retention-days: 14
  publish:
    needs: package
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: runner-*
          path: release
          merge-multiple: true
      - name: Publish tested launchers and signed runtimes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="runner-$(git rev-parse --short=12 HEAD)"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" release/* --target "$(git rev-parse HEAD)" --title "Utility Studio local runner" --notes-file launcher/RELEASE_NOTES.md
          fi
